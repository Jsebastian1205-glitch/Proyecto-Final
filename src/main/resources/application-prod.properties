# =====================================================================
# Perfil "prod": BuildZone publicado en internet (Railway u otro hosting)
# ---------------------------------------------------------------------
# Se activa con la variable de entorno SPRING_PROFILES_ACTIVE=prod (el
# Dockerfile ya la define). Todas las claves salen de variables de entorno:
# NINGUNA esta escrita aqui. Si falta alguna o es la de ejemplo, la
# aplicacion no arranca (ver config/ValidadorConfiguracion.java).
# Guia completa: docs/DESPLIEGUE.md
# =====================================================================

# Puerto que asigna el hosting (Railway define PORT); 8080 si no existe.
server.port=${PORT:8080}

# Detras del proxy HTTPS del hosting: Tomcat toma la IP real del visitante
# y sabe que la conexion original era HTTPS (necesario para HSTS).
server.forward-headers-strategy=native

# ---------------------------------------------------------------------
# Base de datos MySQL
# Opcion A: DB_URL completa (jdbc:mysql://host:puerto/base?...)
# Opcion B (Railway): las variables MYSQLHOST, MYSQLPORT, MYSQLDATABASE,
#   MYSQLUSER y MYSQLPASSWORD que crea el servicio MySQL de Railway.
# ---------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://${MYSQLHOST:}:${MYSQLPORT:3306}/${MYSQLDATABASE:}?sslMode=PREFERRED&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:${MYSQLUSER:root}}
spring.datasource.password=${DB_PASSWORD:${MYSQLPASSWORD:}}
# Pocas conexiones: los planes gratuitos tienen poca memoria
spring.datasource.hikari.maximum-pool-size=5

# Estructura y datos del catalogo, blog y planes. SIN el script 03: en
# produccion no existen las cuentas de prueba con contrasena conocida.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/00_estructura.sql,classpath:db/01_usuarios_suscripciones.sql
spring.sql.init.data-locations=classpath:db/02_datos_completos.sql
spring.sql.init.encoding=UTF-8
spring.sql.init.continue-on-error=false

# ---------------------------------------------------------------------
# Claves (obligatorias, sin valor por defecto)
# ---------------------------------------------------------------------
# Base64 de al menos 32 bytes. Generar con: openssl rand -base64 48
buildzone.jwt.secret=${JWT_SECRET:}
# Administrador inicial: se crea solo la primera vez que arranca.
buildzone.admin.email=${ADMIN_EMAIL:admin@buildzone.com}
buildzone.admin.password=${ADMIN_PASSWORD:}

# Sin CORS: la pagina y la API estan en el mismo dominio. Si algun dia
# otro sitio necesita llamar a la API, poner su dominio exacto (nunca *).
buildzone.cors.origenes-permitidos=${CORS_ORIGENES:}

# Nunca mostrar detalles internos en los errores
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false
spring.jpa.show-sql=false
spring.h2.console.enabled=false
