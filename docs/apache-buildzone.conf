# =====================================================================
# BuildZone detras de Apache (XAMPP): http://localhost/BuildZone/
#
# 1. En C:\xampp\apache\conf\httpd.conf quite el # de estas dos lineas:
#      LoadModule proxy_module modules/mod_proxy.so
#      LoadModule proxy_http_module modules/mod_proxy_http.so
# 2. Pegue este bloque al final de httpd.conf.
# 3. Reinicie Apache en el panel de XAMPP (Stop y Start).
# 4. Arranque BuildZone con iniciar.bat (sigue corriendo en el puerto 8080).
# =====================================================================

# /BuildZone sin barra final -> /BuildZone/
RedirectMatch ^/BuildZone$ /BuildZone/

# Todo lo que llegue a /BuildZone/ se pasa a Spring Boot
ProxyPass        /BuildZone/ http://localhost:8080/BuildZone/
ProxyPassReverse /BuildZone/ http://localhost:8080/BuildZone/
