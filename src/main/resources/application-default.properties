# =====================================================================
# Perfil por defecto (MySQL/MariaDB de XAMPP): carga automatica de datos
# ---------------------------------------------------------------------
# Spring Boot usa este archivo solo cuando NO hay un perfil activo, es
# decir, con "iniciar.bat mysql" o "mvn spring-boot:run" (el perfil dev
# tiene su propia carga en application-dev.properties).
#
# Al arrancar ejecuta, en orden, los scripts de database/mysql (Maven
# los copia al classpath en la carpeta db/, ver <resources> en pom.xml):
#   00_estructura.sql            crea las 10 tablas del modelo si faltan
#   01_usuarios_suscripciones.sql crea usuario_cuenta, plan_suscripcion
#                                 y suscripcion si faltan
#   02_datos_completos.sql       84 productos, fichas tecnicas, precios,
#                                 blog y duelos de ejemplo
#   03_cuentas_prueba.sql        5 cuentas de prueba (Prueba1234); el
#                                 perfil prod NO lo carga
# Los tres se pueden repetir: no borran ni duplican datos, solo agregan
# lo que falte. Asi basta con crear la base "buildzone" vacia en
# phpMyAdmin y arrancar la aplicacion.
# Para desactivarlo: spring.sql.init.mode=never
# =====================================================================
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/00_estructura.sql,classpath:db/01_usuarios_suscripciones.sql
spring.sql.init.data-locations=classpath:db/02_datos_completos.sql,classpath:db/03_cuentas_prueba.sql
spring.sql.init.encoding=UTF-8
spring.sql.init.continue-on-error=false
