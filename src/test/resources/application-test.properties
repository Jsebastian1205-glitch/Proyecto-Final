# Perfil "test": base H2 en memoria, independiente de XAMPP, recreada en
# cada ejecucion de las pruebas.
spring.datasource.url=jdbc:h2:mem:buildzone_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Limites altos por IP: todas las pruebas usan la misma direccion (127.0.0.1)
# y crean muchas cuentas. El limite por cuenta se deja en 5 para probarlo.
buildzone.limites.login-por-ip=10000
buildzone.limites.registro-por-ip=10000
buildzone.limites.formularios-por-ip=10000
